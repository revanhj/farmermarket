apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmermarket

spec:
  replicas: 2

  selector:
    matchLabels:
      app: farmermarket

  template:
    metadata:
      labels:
        app: farmermarket

    spec:
      containers:
      - name: farmermarket

        image: 40005005/farmermarket:latest

        ports:
        - containerPort: 8080

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20